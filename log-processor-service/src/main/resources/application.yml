server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/log_intelligence
    username: jeel
    password: jeel123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: log-processor-group
      auto-offset-reset: earliest
    producer:
      acks: all

app:
  retry:
    max-attempts: 3
  notification:
    max-attempts: 3
    backoff-ms: 1000
    timeout-ms: 3000
  kafka:
    topics:
      raw: logs.raw.v1
      normalized: logs.normalized.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true